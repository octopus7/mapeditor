<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172219" />
    <title>Google 로그인 · Forest Map Editor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/login/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <p class="eyebrow">FOREST MAP EDITOR</p>
        <h1 id="login-title">Google 로그인</h1>
        <p class="description">Google 계정으로 로그인하면 나만의 지도와 이미지를 저장할 수 있습니다.</p>
        <div id="login-status" class="status" role="status" aria-live="polite">로그인 준비 중…</div>
        <button id="google-login" class="google-login" type="button" disabled>Google 로그인</button>
        <a class="back-link" href="/">편집기로 돌아가기</a>
      </section>
    </main>
    <script src="/login/login.js" defer></script>
  </body>
</html>
